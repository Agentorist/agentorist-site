  <path fill="currentColor" d="M 28 44 L 72 44 L 72 56 L 28 56 Z"/>
  <!-- S needle: inside V notch, protruding below the base -->
  <path fill="currentColor" d="M 47 68 L 53 68 L 50 84 Z"/>
</svg>
