<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Agentorist">
  <title>Agentorist</title>
  <!-- A silhouette with E and W needles as integrated extensions of the crossbar zone -->
  <path fill="currentColor" d="
    M 50 10
    L 63.6 42
    L 96 50
    L 70.4 58
    L 78 76
    L 64 76
    L 50 56
    L 36 76
    L 22 76
    L 29.6 58
    L 4 50
    L 36.4 42
